services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_inbox}
      POSTGRES_USER: ${POSTGRES_USER:-agent_inbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    image: agent-inbox:local
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      notification-sink:
        condition: service_healthy
    environment:
      INBOX_LISTEN_ADDR: ":8080"
      INBOX_STORAGE: postgres
      INBOX_DATABASE_URL: ${INBOX_DATABASE_URL:-postgres://${POSTGRES_USER:-agent_inbox}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agent_inbox}?sslmode=disable}
      INBOX_REGISTRY_PATH: /etc/agent-inbox/registry.json
      # Local Compose uses the bundled sink; production must set a human-operated webhook.
      INBOX_WEBHOOK_URL: ${INBOX_WEBHOOK_URL:-http://notification-sink:8081/notifications}
      INBOX_RETRY_INTERVAL: ${INBOX_RETRY_INTERVAL:-30s}
      INBOX_MAX_DOORBELL_ATTEMPTS: ${INBOX_MAX_DOORBELL_ATTEMPTS:-3}
      INBOX_REQUEST_SKEW: ${INBOX_REQUEST_SKEW:-5m}
    ports:
      - "127.0.0.1:${INBOX_HOST_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${INBOX_REGISTRY_FILE:-./config/registry.json}
        target: /etc/agent-inbox/registry.json
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/inboxd", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
